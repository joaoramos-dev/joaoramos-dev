name: Update profile stats

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Fetch stats and render profile SVG
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_USER: joaoramos-dev
          GH_EMAILS: ${{ secrets.GH_EMAILS }}
          BIRTH_DATE: ${{ secrets.BIRTH_DATE }}
        run: python scripts/update_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update profile stats"
            git push
          fi
